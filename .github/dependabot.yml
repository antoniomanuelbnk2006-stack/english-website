# Actualizaciones semanales de dependencias, agrupadas para no llenar el repositorio de PR
# (docs/04-arquitectura/07-seguridad-y-privacidad.md §8). Cada PR pasa el CI antes de mezclarse.
# Los avisos de seguridad se activan aparte, en Settings → Code security → Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      # Lo que se despliega y lo que no, por separado. Los saltos de versión mayor llegan
      # sueltos: Next y React cambian cosas de una mayor a otra y hay que mirarlos uno a uno.
      produccion:
        dependency-type: production
        update-types: [minor, patch]
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Madrid
